name: Build Release

on:
  workflow_dispatch:
    inputs:
      platform:
        description: '选择构建平台'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - linux
          - windows
          - macos

# 同一分支的新运行会取消正在进行中的旧运行
concurrency:
  group: build-${{ github.ref }}-${{ inputs.platform }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────────────
  # Linux 构建（x64 + arm64）
  # 每个架构使用对应的原生 runner。node-pty 等依赖包含原生二进制，
  # 不能从 x64 runner 交叉打包到 ARM64。
  # ──────────────────────────────────────────────────────────────────────
  build-linux:
    name: Build Linux (${{ matrix.arch }})
    if: ${{ inputs.platform == 'all' || inputs.platform == 'linux' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x64
            arch-flag: --x64
            build-target: --linux
            platform-key: linux-x64
            artifact-name: HappyFriday-Linux-x64
          - os: ubuntu-24.04-arm
            arch: arm64
            arch-flag: --arm64
            # electron-builder ships FPM only for x86, so an ARM64 runner
            # cannot create a .deb. AppImage is built without FPM.
            build-target: --linux AppImage
            platform-key: linux-arm64
            artifact-name: HappyFriday-Linux-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Python for native modules
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Remove Chinese npm mirrors (CI uses official sources)
        run: rm -f .npmrc
        shell: bash

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools

      - name: Install npm dependencies
        # dsh currently declares a Linux-only native package as a direct dependency.
        # --force lets npm install the remaining dependencies on every runner OS.
        run: npm ci --legacy-peer-deps --force
        env:
          # node-gyp bundled by node-pty still imports distutils, removed in Python 3.12.
          npm_config_python: ${{ steps.setup-python.outputs.python-path }}

      - name: Build frontend
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Pre-build install & clean (target arch bindings only)
        run: |
          node scripts/prebuild-install.mjs ${{ matrix.arch }}
          node scripts/prebuild-clean.mjs ${{ matrix.arch }}

      - name: Build Electron app (Linux ${{ matrix.arch }})
        run: npx electron-builder ${{ matrix.build-target }} ${{ matrix.arch-flag }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          npm_config_python: ${{ steps.setup-python.outputs.python-path }}

      - name: List build artifacts
        run: ls -lh release/ || true
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
          retention-days: 30

  # ──────────────────────────────────────────────────────────────────────
  # Windows 构建（x64）
  # ──────────────────────────────────────────────────────────────────────
  build-windows:
    name: Build Windows (x64)
    if: ${{ inputs.platform == 'all' || inputs.platform == 'windows' }}
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Remove Chinese npm mirrors (CI uses official sources)
        run: rm -f .npmrc
        shell: bash

      - name: Install npm dependencies
        run: npm ci --legacy-peer-deps --force

      - name: Build frontend
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Install Windows native bindings
        run: |
          node scripts/prebuild-install.mjs win32 x64

      - name: Verify Windows node-pty prebuilds
        run: |
          node -e "const fs=require('fs'); for (const file of ['pty.node','conpty.node','conpty_console_list.node']) { const filename='node_modules/node-pty/prebuilds/win32-x64/'+file; if (!fs.existsSync(filename)) throw new Error('Missing '+filename); }"

      - name: Build Electron app (Windows x64)
        # node-pty 1.1.0 ships Electron-compatible Node-API prebuilds for
        # Windows x64. Rebuilding it invokes node-gyp unnecessarily and fails
        # on newer GitHub Windows images when detecting Visual Studio.
        run: npx electron-builder --win --x64 --config.npmRebuild=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List build artifacts
        run: ls -lh release/ || true
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HappyFriday-Windows-x64
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30

  # ──────────────────────────────────────────────────────────────────────
  # macOS 构建（arm64 + x64）
  # 在 Intel runner 交叉构建 ARM64：electron-builder 会为目标架构重建
  # 原生依赖，且可避免 ARM runner 上 APFS DMG 创建的 hdiutil 兼容性问题。
  # ──────────────────────────────────────────────────────────────────────
  build-macos:
    name: Build macOS (${{ matrix.arch }})
    if: ${{ inputs.platform == 'all' || inputs.platform == 'macos' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-13
            arch: arm64
            arch-flag: --arm64
            artifact-name: HappyFriday-macOS-arm64
          - os: macos-13
            arch: x64
            arch-flag: --x64
            artifact-name: HappyFriday-macOS-x64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Python for native modules
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Remove Chinese npm mirrors (CI uses official sources)
        run: rm -f .npmrc
        shell: bash

      - name: Install npm dependencies
        run: npm ci --legacy-peer-deps --force
        env:
          npm_config_python: ${{ steps.setup-python.outputs.python-path }}

      - name: Build frontend
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Install macOS native bindings
        run: |
          node scripts/prebuild-install.mjs darwin ${{ matrix.arch }}

      - name: Build Electron app (macOS ${{ matrix.arch }})
        run: npx electron-builder --mac ${{ matrix.arch-flag }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USE_HARD_LINKS: false
          npm_config_python: ${{ steps.setup-python.outputs.python-path }}

      - name: List build artifacts
        run: ls -lh release/ || true
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: release/*.dmg
          if-no-files-found: error
          retention-days: 30
