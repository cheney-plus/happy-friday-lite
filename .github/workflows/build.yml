name: Build Release

on:
  workflow_dispatch:
    inputs:
      platform:
        description: '选择构建平台'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - linux
          - windows
          - macos

# 同一分支的新运行会取消正在进行中的旧运行
concurrency:
  group: build-${{ github.ref }}-${{ inputs.platform }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────────────
  # Linux 构建（x64 + arm64）
  # 每个架构使用对应的原生 runner。node-pty 等依赖包含原生二进制，
  # 不能从 x64 runner 交叉打包到 ARM64。
  # ──────────────────────────────────────────────────────────────────────
  build-linux:
    name: Build Linux (${{ matrix.arch }})
    if: ${{ inputs.platform == 'all' || inputs.platform == 'linux' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x64
            arch-flag: --x64
            platform-key: linux-x64
            artifact-name: HappyFriday-Linux-x64
          - os: ubuntu-24.04-arm
            arch: arm64
            arch-flag: --arm64
            platform-key: linux-arm64
            artifact-name: HappyFriday-Linux-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Remove Chinese npm mirrors (CI uses official sources)
        run: rm -f .npmrc
        shell: bash

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools

      - name: Install npm dependencies
        # dsh currently declares a Linux-only native package as a direct dependency.
        # --force lets npm install the remaining dependencies on every runner OS.
        run: npm ci --legacy-peer-deps --force

      - name: Build frontend
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Pre-build install & clean (target arch bindings only)
        run: |
          node scripts/prebuild-install.mjs ${{ matrix.arch }}
          node scripts/prebuild-clean.mjs ${{ matrix.arch }}

      - name: Build Electron app (Linux ${{ matrix.arch }})
        run: npx electron-builder --linux ${{ matrix.arch-flag }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List build artifacts
        run: ls -lh release/ || true
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
          retention-days: 30

  # ──────────────────────────────────────────────────────────────────────
  # Windows 构建（x64）
  # ──────────────────────────────────────────────────────────────────────
  build-windows:
    name: Build Windows (x64)
    if: ${{ inputs.platform == 'all' || inputs.platform == 'windows' }}
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Remove Chinese npm mirrors (CI uses official sources)
        run: rm -f .npmrc
        shell: bash

      - name: Install npm dependencies
        run: npm ci --legacy-peer-deps --force

      - name: Build frontend
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Install Windows native bindings
        run: |
          node scripts/prebuild-install.mjs win32 x64

      - name: Build Electron app (Windows x64)
        run: npx electron-builder --win --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List build artifacts
        run: ls -lh release/ || true
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HappyFriday-Windows-x64
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30

  # ──────────────────────────────────────────────────────────────────────
  # macOS 构建（arm64 + x64）
  # 每个架构使用原生 runner，避免将错误架构的 node-pty 打进发布包。
  # ──────────────────────────────────────────────────────────────────────
  build-macos:
    name: Build macOS (${{ matrix.arch }})
    if: ${{ inputs.platform == 'all' || inputs.platform == 'macos' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
            arch-flag: --arm64
            artifact-name: HappyFriday-macOS-arm64
          - os: macos-13
            arch: x64
            arch-flag: --x64
            artifact-name: HappyFriday-macOS-x64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Remove Chinese npm mirrors (CI uses official sources)
        run: rm -f .npmrc
        shell: bash

      - name: Install npm dependencies
        run: npm ci --legacy-peer-deps --force

      - name: Build frontend
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Install macOS native bindings
        run: |
          node scripts/prebuild-install.mjs darwin ${{ matrix.arch }}

      - name: Build Electron app (macOS ${{ matrix.arch }})
        run: npx electron-builder --mac ${{ matrix.arch-flag }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USE_HARD_LINKS: false

      - name: List build artifacts
        run: ls -lh release/ || true
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: release/*.dmg
          if-no-files-found: error
          retention-days: 30
